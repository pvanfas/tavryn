name: Refresh Public Stats

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Fetch live stats from /api/stats
        id: fetch
        env:
          STATS_URL: ${{ vars.STATS_URL || 'https://tavryn.vercel.app/api/stats' }}
        run: |
          echo "Fetching stats from $STATS_URL..."
          HTTP_CODE=$(curl -s -o /tmp/stats_response.json -w "%{http_code}" "$STATS_URL")
          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::warning::Stats endpoint returned HTTP $HTTP_CODE"
            cat /tmp/stats_response.json
            exit 1
          fi

          # Validate JSON
          if ! python3 -m json.tool /tmp/stats_response.json > /dev/null 2>&1; then
            echo "::error::Response is not valid JSON"
            cat /tmp/stats_response.json
            exit 1
          fi

          # Pretty-print for commit
          python3 -m json.tool /tmp/stats_response.json > /tmp/stats_pretty.json
          cat /tmp/stats_pretty.json

      - name: Generate STATS.md
        run: |
          STATS=$(cat /tmp/stats_response.json)
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          cat > STATS.md << 'HEADER'
          # Tavryn — Live Traction Stats

          > Auto-generated by [stats.yml](.github/workflows/stats.yml). Do not edit manually.

          HEADER

          echo "**Last refreshed:** $DATE" >> STATS.md
          echo "" >> STATS.md
          echo "| Metric | Value |" >> STATS.md
          echo "|--------|-------|" >> STATS.md

          # Extract values with python for reliability
          python3 << 'PYEOF' >> STATS.md
          import json, sys
          with open("/tmp/stats_response.json") as f:
              data = json.load(f)
          s = data.get("stats", data)
          rows = [
              ("Real Businesses", s.get("totalRealBusinesses", 0)),
              ("Contracts Analyzed", s.get("totalContractsAnalyzed", 0)),
              ("Negotiations Run", s.get("totalNegotiations", 0)),
              ("USDC Moved (Released)", f"${s.get('totalUsdcMoved', 0):,.2f}"),
              ("USDC Escrowed", f"${s.get('totalUsdcEscrowed', 0):,.2f}"),
              ("Decisions Auto-Approved", s.get("decisionsAutoApproved", 0)),
              ("Decisions Escalated", s.get("decisionsEscalated", 0)),
              ("Human Agreement Rate", f"{s.get('humanAgreementRatePct', 0)}%"),
              ("Savings Negotiated", f"${s.get('savingsNegotiated', 0):,.2f}"),
              ("Savings Realized", f"${s.get('savingsRealized', 0):,.2f}"),
              ("Savings Rate", f"{s.get('savingsRatePct', 0)}%"),
          ]
          for label, val in rows:
              print(f"| {label} | {val} |")
          PYEOF

          echo "" >> STATS.md
          echo "---" >> STATS.md
          echo "" >> STATS.md
          echo '<details><summary>Raw JSON</summary>' >> STATS.md
          echo '' >> STATS.md
          echo '```json' >> STATS.md
          cat /tmp/stats_pretty.json >> STATS.md
          echo '```' >> STATS.md
          echo '' >> STATS.md
          echo '</details>' >> STATS.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add STATS.md
          if git diff --cached --quiet; then
            echo "No changes to STATS.md"
          else
            git commit -m "chore: refresh STATS.md ($(date -u +%Y-%m-%d))"
            git push
          fi
